---
- name: Start or stop guard service
  become: true
  become_user: "{{ run_account }}"
  shell:
    cd /opt/app/rhs/home/{{ run_account }}/rhs/guard_v2 && ./{{ target_action }}.sh
  register: guard
  ignore_errors: true

- debug:
    msg: "Output: {{ guard.stdout | default('No output') }} | Error: {{ guard.stderr | default('No error') }}"

- name: Get guard process count
  shell: ps -elf | grep '[g]uard' | wc -l
  register: guard_count

- name: Guard service failed to stop
  fail:
    msg: "Guard service failed to stop. Process count: {{ guard_count.stdout }}"
  when: (guard_count.stdout | int > 0) and (target_action == "stop")

- name: Guard service failed to start
  fail:
    msg: "Guard service failed to start. Process count: {{ guard_count.stdout }}"
  when: (guard_count.stdout | int == 0) and (target_action == "start")