# ======================================================================
# Author:               Goran Wong
# Description:          Start / Stop template for Realiti
# Version:              v1
# First Draft:          2026-07-28
# last update:          2026-09-02
# ----------------------------------------------------------------------
# Survey Variables:
# - target_action (start / stop application) 
# - target_server 
# ======================================================================
---
- name: Start/Stop applications for Realiti
  hosts: "{{ target_server }}"
  become: true
  become_method: sudo
  become_flags: -i
  become_user: realitidist
  gather_facts: false
  tasks:
    - name: "{{ target_action }} Realiti cron job"
      include_tasks: tasks/crontab_realitidist.yaml
    
    - name: "{{ target_action }} Realiti"
      include_tasks: tasks/supervisorctl.yaml  
    


